name: CPU integration and upstream integrity
on:
  push:
    paths:
      - 'aigcdetect/**'
      - 'tools/**'
      - 'tests/**'
      - 'configs/**'
      - 'scripts/**'
      - 'requirements-runtime.txt'
      - 'pyproject.toml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned CPU reference environment
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-runtime.txt
          python -m pip install -e . --no-deps
      - run: python tools/validate_delivery.py --output validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-validation
          path: validation/
