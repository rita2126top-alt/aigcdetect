name: Prepare offline CPU-test dependencies
on:
  push:
    paths: ['.github/workflows/prepare-test-deps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip download ftfy==6.3.1 --dest wheels
      - uses: actions/upload-artifact@v4
        with:
          name: offline-test-wheels
          path: wheels/*.whl
