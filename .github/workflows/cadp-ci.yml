name: CADP CPU correctness
on:
  push:
    paths: ['cadp/**', 'tests/cadp/**', 'configs/cadp/**', 'scripts/cadp/**', 'requirements-cadp.txt', 'environment-cadp.yml', 'pytest-cadp.ini', 'pyproject.toml', '.github/workflows/cadp-ci.yml']
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-cadp.txt
      - run: python -m cadp.cli verify-upstream
      - run: python -m pytest -c pytest-cadp.ini -p no:cacheprovider -q --junitxml=/tmp/cadp-junit.xml
      - run: python scripts/cadp/check_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cadp-cpu-junit
          path: /tmp/cadp-junit.xml
