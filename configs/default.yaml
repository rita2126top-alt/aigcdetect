paths:
  ppmclip_root: ./PPM_CLIP
  clip_model: ./weights/clip/ViT-L-14.pt
  output_dir: ./outputs/genimage_full
  genimage_snapshot: ./datasets/GenImage_arrow
  genimage_export: ./datasets/GenImage_raw
  download_dir: ./datasets/downloads
  suite_output: ./outputs/suites
runtime:
  device: cuda:0
model:
  backbone: ViT-L/14
  lora:
    position: half-up
    target: qkv
    rank: 4
    alpha: 0.5
    dropout: 0.0
  dct_select_rate: 0.5
  dct_margin: 1.0
  prompt:
    repositories: 2
    shared_tokens: 3
    private_max: 7
    private_candidates:
    - 1
    - 3
    - 5
    - 7
    train_samples: 1
    test_samples: 10
    router_hidden: 512
    eval_seed: 0
    image_chunk_size: 4
    sample_chunk_size: 1
    text_chunk_size: 32
    gradient_checkpointing: true
    fixed_private_length: 7
  flow:
    layers: 10
    hidden_dim: 1024
    rho_shared: 0.1
    rho_private: 0.1
  cross_attention:
    dim: 256
    heads: 4
    ffn_ratio: 4
    dropout: 0.1
    alpha_max: 0.5
    alpha_init: 0.1
data:
  train_root: ./datasets/GenImage_SD14/train
  val_root: ./datasets/GenImage_SD14/val
  test_root: ./datasets/GenImage
  test_sets:
  - Midjourney
  - stable_diffusion_v_1_4
  - stable_diffusion_v_1_5
  - ADM
  - glide
  - wukong
  - VQDM
  - BigGAN
  num_workers: 8
  load_size: 256
  image_size: 224
  eval_batch_size: 8
  train_classes: []
training:
  seed: 0
  epochs: 100
  batch_size: 48
  lr_new: 0.0001
  lr_lora: 1.0e-05
  weight_decay: 0.0001
  amp: true
  grad_clip: 5.0
  selection_metric: ap
  resume: null
  accumulate_steps: 1
loss:
  rec: 0.5
  kl: 0.001
  patch: 0.5
  anchor: 0.001
  len: 0.001
ablation:
  disable_cross_attention: false
  disable_dynamic_length: false
  disable_probabilistic_prompt: false
  disable_dct_loss: false
  freeze_class_anchors: false
  disable_lora: false
evaluation:
  jpeg_qualities:
  - 95
  - 75
  - 50
  blur_radii:
  - 1.0
  - 2.0
downloads:
  genimage_repo: nebula/GenImage-arrow
  genimage_revision: main
  train_generator: stable_diffusion_v_1_4
  val_fraction: 0.1
  split_seed: 0
  max_workers: 4
  ojha_archives:
    train:
      id: 1iVNBV0glknyTYGA9bCxT_d0CVTOgGcKh
      filename: train.zip
    val:
      id: 1FU7xF8Wl_F8b0tgL0529qg2nZ_RpdVNL
      filename: val.zip
    cnn_test:
      id: 1z_fD3UKgWQyOTZIBbYSaQ-hz4AzUrLC1
      filename: cnn_test.zip
    diffusion:
      id: 1FXlGIRh_Ud3cScMgSVDbEWmPDmjcrm1t
      filename: diffusion.zip
