# Official publisher's Google Drive folder; large download, NOT a small demo dataset.
# The command without --execute prints the destination and URL only.
assets:
  - name: GenImage official archives
    type: gdrive_folder
    url: https://drive.google.com/drive/folders/1jGt10bwTbhEZuGXLyvrCuxOI0cBqQ1FS?usp=sharing
    destination: downloads/GenImage
